packages:
  - 'apps/**'
  - 'packages/**'
  - 'tools/**'
  - '!**/test/**'
  - '!**/dist/**'
  - '!**/publish/**'

saveExact: true
shellEmulator: true

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  browser-tabs-lock: false
  esbuild: true
  lightningcss: true
  msw: false
  prisma: false
  workerd: false

patchedDependencies:
  tinykeys: patches/tinykeys.patch

catalogs:
  solid2:
    '@solidjs/compiler': 2.0.2
    '@solidjs/router': 2.0.1
    '@solidjs/vite-plugin': 3.0.1
    '@solidjs/web': 2.0.3
    solid-codemirror: 3.0.0
    solid-js: 2.0.3
    statebuilder: 0.9.0-alpha.1
  next:
    '@codemirror/autocomplete': '^6.20.1'
    '@codemirror/commands': '^6.10.3'
    '@codemirror/lang-cpp': '^6.0.3'
    '@codemirror/lang-css': '^6.3.1'
    '@codemirror/lang-html': '^6.4.11'
    '@codemirror/lang-java': '^6.0.2'
    '@codemirror/lang-javascript': '^6.2.5'
    '@codemirror/lang-json': '^6.0.2'
    '@codemirror/lang-markdown': '^6.5.0'
    '@codemirror/lang-php': '^6.0.2'
    '@codemirror/lang-python': '^6.2.1'
    '@codemirror/lang-rust': '^6.0.2'
    '@codemirror/lang-sql': '^6.10.0'
    '@codemirror/language': '^6.12.3'
    '@codemirror/lint': '^6.9.5'
    '@codemirror/search': '^6.6.0'
    '@codemirror/state': '^6.6.0'
    '@codemirror/view': '^6.40.0'
    '@lezer/highlight': ^1.2.3
    '@types/node': ^25.9.9
    '@vanilla-extract/vite-plugin': ^5.2.1
    oxfmt: ^0.78.0
    oxlint: ^1.93.0
    rimraf: ^6.1.3
    rolldown-plugin-solid: ^0.2.1
    sass: ^1.98.0
    solid-codemirror: ^2.3.2
    solid-js: ^1.9.12
    tsdown: ^0.23.7
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite: ^8.3.8
    vite-plugin-dts: ^4.5.4
    vite-plugin-solid: ^2.11.11
    vite-tsconfig-paths: ^6.1.1
    vitest: ^4.1.12

overrides:
  typescript: 'catalog:next'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@fastify/swagger-ui@6.1.4'
  - '@kobalte/core@2.0.0-alpha.5'
  - '@kobalte/utils@2.0.0-alpha.2'
  - fast-json-stringify@7.3.6
  - postcss@8.5.33
  - solid-codemirror@3.0.0
  - statebuilder@0.9.0-alpha.1
  - sql-escaper@1.6.0
