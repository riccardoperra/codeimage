name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, assigned]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, assigned]
    branches:
      - changeset-release/main

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - uses: dorny/paths-filter@v4
        id: diff-changes
        with:
          filters: |
            app:
              - apps/codeimage/**
              - package.json
              - pnpm-lock.json
            libs:
              - packages/**
              - package.json
              - pnpm-lock.json
            backend:
              - 'packages/prisma-models/**'
              - 'apps/api/**'
              - package.json
              - pnpm-lock.json

    outputs:
      backend-change: 'true'
      app-change: 'true'
      libs-change: 'true'
  #      backend-change: ${{ steps.filter.outputs.backend }}
  #      app-change: ${{ steps.filter.outputs.app }}
  #      libs-change: ${{ steps.filter.outputs.libs }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Prisma migrate
        run: |
          cd apps/api
          pnpm prisma generate
          pnpm --filter=@codeimage/prisma-models build

      - name: Lint
        run: pnpm lint

  build-packages:
    name: Build packages
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Prisma migrate
        run: |
          cd apps/api
          pnpm prisma generate
          pnpm --filter=@codeimage/prisma-models build

      - name: Build packages
        run: |
          pnpm libs:build

      - name: Upload packages dist
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/*/dist
            packages/prisma-models/generated
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  typecheck-packages:
    if: ${{ needs.install.outputs.libs-change == 'true' }}
    name: Type-checking
    needs: [install, build-packages, build-api]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Download packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Download api dist
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist

      - name: Typecheck packages
        run: |
          pnpm --filter='./packages/**' --recursive typecheck:ci

      - name: Typecheck app
        run: |
          pnpm --filter='@codeimage/api' typecheck:ci
          pnpm --filter='@codeimage/app' typecheck

  build-app-preview:
    name: Build App (Preview)
    environment: Preview
    needs: [build-packages]
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Download packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Build app
        env:
          VITE_PUBLIC_AUTH0_DOMAIN: ${{ secrets.VITE_PUBLIC_AUTH0_DOMAIN }}
          VITE_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.VITE_PUBLIC_AUTH0_CLIENT_ID }}
          VITE_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.VITE_PUBLIC_AUTH0_AUDIENCE }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ENABLE_MSW: true
          VITE_PRESET_LIMIT: 10
          VITE_PRESET_LIMIT_GUEST: 5
          UMAMI_SCRIPT_SRC: ${{ secrets.UMAMI_SCRIPT_SRC }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          pnpm --filter=@codeimage/app build

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-app
          path: apps/codeimage/dist
          retention-days: 1
          if-no-files-found: error

  build-app-rc:
    name: Build App (RC)
    environment: Next
    needs: [build-packages]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Download packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Build app
        env:
          VITE_PUBLIC_AUTH0_DOMAIN: ${{ secrets.VITE_PUBLIC_AUTH0_DOMAIN }}
          VITE_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.VITE_PUBLIC_AUTH0_CLIENT_ID }}
          VITE_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.VITE_PUBLIC_AUTH0_AUDIENCE }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ENABLE_MSW: false
          VITE_PRESET_LIMIT: 10
          VITE_PRESET_LIMIT_GUEST: 5
          UMAMI_SCRIPT_SRC: ${{ secrets.UMAMI_SCRIPT_SRC }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          pnpm --filter=@codeimage/app build

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-app
          path: apps/codeimage/dist
          retention-days: 1
          if-no-files-found: error

  build-highlight-dev:
    name: '@codeimage/highlight dev and Preview'
    environment: Preview
    needs: [build-packages]
    if: (${{ needs.install.outputs.app-change == 'true' }} || ${{ needs.install.outputs.libs-change == 'true' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Download packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Build highlight demo
        run: |
          pnpm --filter=@codeimage/highlight build:dev --base=/highlight/

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-highlight
          path: packages/highlight/dev/dist
          retention-days: 1
          if-no-files-found: error

  build-website-dev:
    name: '@codeimage/website dev and Preview'
    environment: Preview
    needs: [build-packages]
    if: (${{ needs.install.outputs.app-change == 'true' }} || ${{ needs.install.outputs.libs-change == 'true' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Download packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Build website preview
        env:
          VITE_UMAMI_SCRIPT_SRC: ${{ secrets.UMAMI_LANDING_SCRIPT_SRC }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_LANDING_WEBSITE_ID }}
          VITE_PUBLIC_AUTH0_DOMAIN: ${{ secrets.VITE_PUBLIC_AUTH0_DOMAIN }}
          VITE_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.VITE_PUBLIC_AUTH0_CLIENT_ID }}
          VITE_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.VITE_PUBLIC_AUTH0_AUDIENCE }}
        run: |
          pnpm --filter=@codeimage/website build --base=/website/

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-website
          path: apps/website/dist/client
          retention-days: 1
          if-no-files-found: error

  website-lhci:
    name: Lighthouse
    needs: [build-website-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Download website
        uses: actions/download-artifact@v4
        with:
          name: preview-website
          path: apps/website/dist/client

      - name: run Lighthouse CI
        run: |
          site_root="$RUNNER_TEMP/lhci-site"
          mkdir -p "$site_root"
          cp -R apps/website/dist/client "$site_root/website"
          cd apps/website
          pnpm lighthouse --collect.staticDistDir="$site_root" --collect.url=http://localhost/website/
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy-preview:
    name: Deploy preview
    needs:
      [build-app-preview, build-app-rc, build-highlight-dev, build-website-dev]
    if: ${{ !cancelled() && contains(needs.*.result, 'success') }}
    environment:
      name: ${{ github.event_name == 'push' && 'Next' || 'Preview' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Download app
        if: ${{ needs.build-app-preview.result == 'success' || needs.build-app-rc.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: preview-app
          path: site
      - name: Download website
        if: ${{ needs.build-website-dev.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: preview-website
          path: site/website
      - name: Download highlight
        if: ${{ needs.build-highlight-dev.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: preview-highlight
          path: site/highlight

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: ./.github/actions/cloudflare-pages-deploy
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project-name: codeimage-preview
          directory: site
          branch: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
          production-branch: main

      - name: Comment preview links
        if: ${{ !cancelled() && github.event.pull_request.number }}
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_RESULT: ${{ needs.build-app-preview.result != 'skipped' && needs.build-app-preview.result || needs.build-app-rc.result }}
          WEBSITE_RESULT: ${{ needs.build-website-dev.result }}
          HIGHLIGHT_RESULT: ${{ needs.build-highlight-dev.result }}
        with:
          script: |
            const marker = '<!-- codeimage-preview -->';
            const {PREVIEW_URL: url, RUN_URL: runUrl} = process.env;
            const rows = [
              ['App', process.env.APP_RESULT, '/'],
              ['Website', process.env.WEBSITE_RESULT, '/website/'],
              ['Highlight', process.env.HIGHLIGHT_RESULT, '/highlight/'],
            ].map(([name, result, path]) => {
              const status = result === 'success' && !url ? 'not deployed' : result;
              const link = status === 'success' ? `${url}${path}` : `[logs](${runUrl})`;
              return `| ${name} | ${status} | ${link} |`;
            });
            const body = [
              marker,
              '### Preview',
              '',
              '| Project | Status | Link |',
              '| --- | --- | --- |',
              ...rows,
              '',
              `Commit ${context.payload.pull_request.head.sha}`,
            ].join('\n');
            const issue = {...context.repo, issue_number: context.payload.pull_request.number};
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...issue, body});
            }

  build-api:
    name: Build Api
    needs: [install, build-packages]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: '[API] Generate Prisma Migration'
        run: |
          pnpm --filter=@codeimage/api exec prisma generate
          pnpm --filter=@codeimage/prisma-models build

      - name: Build
        run: |
          pnpm --filter=@codeimage/api build:ts
          pnpm prepare:api:deploy

      - name: Upload api dist
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 1
          if-no-files-found: error

      - name: Upload api bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-bundle
          path: dist/api-bundle
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  be-test:
    if: ${{ needs.install.outputs.backend-change == 'true' }}
    name: Api test
    needs: [install]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_codeimage
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_codeimage
      DOMAIN_AUTH0: https://example.it
      CLIENT_ID_AUTH0: <client-id-auth>
      CLIENT_SECRET_AUTH0: <client-secret-auth>
      AUTH0_CLIENT_CLAIMS: https://example.com
      AUDIENCE_AUTH0: https://example.com
      GRANT_TYPE_AUTH0: client_credentials
      MOCK_AUTH: false
      MOCK_AUTH_EMAIL: dev@example.it
      ALLOWED_ORIGINS: '*'

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Prisma migrate
        run: |
          cd apps/api
          pnpm prisma migrate deploy
          pnpm prisma generate
          pnpm --filter=@codeimage/prisma-models build

      - name: Test (unit)
        run: pnpm --filter=@codeimage/api test:unit

      - name: Test (integration)
        run: pnpm --filter=@codeimage/api test:integration

  deploy-api-rc:
    if: ${{ github.event_name == 'push' }}
    environment: Next
    name: Deploy API (RC)
    needs: [lint, build-packages, build-api, be-test, build-app-rc]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
      - name: 📥 Setup
        uses: ./.github/actions/setup-job
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: Download packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Download api bundle
        uses: actions/download-artifact@v4
        with:
          name: api-bundle
          path: dist/api-bundle

      - name: Run migrations
        run: |
          pnpm --filter=@codeimage/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.NEXT_DATABASE_URL }}

      - name: Deploy
        run: |
          find -type f -name '.gitignore' -delete
          pnpm railway link --environment next $RAILWAY_API_PROJECT_ID
          cd dist/api-bundle
          pnpm railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_PROJECT_ID: ${{ secrets.RAILWAY_API_PROJECT_ID }}

concurrency:
  group: main-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
